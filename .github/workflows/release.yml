name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches manifest version
        run: |
          v=$(node -p "require('./manifest.json').version")
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != manifest.json version $v"; exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
